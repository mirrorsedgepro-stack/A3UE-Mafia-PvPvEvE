name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Mod Configurations
        run: python Tools/pack_arma_mod.py --validate-only

      - name: Pack PBO Addons and Create Archive
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "main" ]; then
            TAG_NAME="v1.0.0"
          fi
          python Tools/pack_arma_mod.py --zip "build/A3UE-Mafia-PvPvEvE-${TAG_NAME}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "A3UE Mafia PvPvEvE Extender ${{ github.ref_name }}"
          draft: false
          prerelease: true   # until the mod has been run in game
          generate_release_notes: true
          files: |
            build/*.zip
            build/@A3UE_Mafia/addons/*.pbo
          body: |
            ## Antistasi Ultimate - Mafia Syndicate extender

            **Not yet run in game.** Treat this as a test build.

            ### What's included
            - **Server-side Mafia layer**: a hidden hideout with Don Salvatore and his guards, protection rackets with collector crews, stash raids, hit squads, and persistence per campaign.
            - **Runs on the server**: loaded with `-serverMod` it works on an existing campaign and players need nothing extra.
            - **Two faction templates** for new campaigns: the Mafia as the rebel faction, or as the rival faction.
            - **Experimental**: players can join the Syndicate (off by default).
            - **Admin / Game Master commands** through `A3UE_fnc_mafiaCommand`.
            - PBOs: `A3UE_core.pbo`, `A3UE_functions.pbo`, `A3UE_templates.pbo`

            ### Installation
            1. Download `A3UE-Mafia-PvPvEvE-${{ github.ref_name }}.zip`.
            2. Extract `@A3UE_Mafia` next to your server's other mods.
            3. Load it with `-serverMod=@A3UE_Mafia` alongside **Antistasi Ultimate**. To pick the Mafia templates for a new campaign, load it as a normal mod on the client that sets the campaign up as well.
